<!doctype html><html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShinySlack HTML Deck — isolated prototype</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#f3f6fb;background:#101322;--line:#46567b;--activityAccent:#55d8ff;--panel:#080b11}
*{box-sizing:border-box}body{margin:0;padding:14px;min-width:340px}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1a234b;border-radius:12px;margin-bottom:10px}
header strong{font-size:13px}header small{margin-left:auto;font-size:11px;color:#aab8df}
button,select{cursor:pointer;background:#111a38;color:inherit;border:1px solid #53618d;border-radius:8px;padding:7px 10px;font:inherit}
button:hover{filter:brightness(1.25)}button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.activityFeed{display:flex;flex-direction:column;gap:9px;max-height:440px;overflow:auto;padding:2px}
.activityItem{
  background:#080b11;
  border:1px solid var(--line);
  border-left:4px solid var(--activityAccent,#55d8ff);
  border-radius:14px;
  padding:12px 14px;
  box-shadow:inset 10px 0 22px -20px var(--activityAccent,#55d8ff);
  transition:border-color .2s ease,box-shadow .2s ease;
}
.activityTop{display:flex;align-items:center;gap:10px}
.activitySource{font-weight:800;color:#f3f6fb;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.activityTime{margin-left:auto;font:11px Consolas,monospace;color:#8b9ab9}
.dismiss{padding:3px 7px;font-size:12px}
.activityMessage{margin-top:7px;color:#d6deea;font-size:12px}
.note{font-size:11px;color:#b3bfda;margin-top:12px}
body[data-theme=retro]{background:#d6e2be;color:#163729;--line:#718c73}
body[data-theme=retro] header{background:#bacfa8}
body[data-theme=retro] .activityItem{background:#dce9cb}
body[data-theme=retro] .activitySource{color:#153c2b}
body[data-theme=retro] .activityTime{color:#385b49}
body[data-theme=retro] button,body[data-theme=retro] select{background:#dce9cb;color:#163729}
body[data-theme=arcade]{background:#111a3c;--line:#536bb5}
body[data-theme=arcade] .activityItem{background:#0a1230}
body[data-theme=arcade] .activitySource{color:#7ee8ff;text-shadow:0 0 10px #55dcff44}
body[data-theme=arcade] .activityTime{color:#ff8bc8}
body[data-theme=ghost]{background:#191228;--line:#5b4777}
body[data-theme=ghost] .activityItem{background:#160f23}
body[data-theme=ghost] .activitySource{color:#f3eaff}
</style><style id="shiny-html-deck-activity-parity-v1">

   These selectors are scoped to the demo document; this does NOT modify the dashboard. */
html{--bg:#090b11;--card:#121622;--card2:#0e121c;--text:#f5f7fb;--muted:#9aa6b7;--line:#252c3a;--cyan:#55d9ff;--pink:#ff5bc8;--ss-inset:#0b0f17;--ss-panel:#131824;--ss-panel-low:#0e121b;color-scheme:dark}
html[data-ss-theme="retro"]{--bg:#cbd9ae;--card:#c0cfa1;--card2:#adbf8d;--text:#233727;--muted:#445b42;--line:#587158;--cyan:#345b40;--pink:#618357;--good:#285f35;--warn:#815d19;--bad:#b82e37;--ss-bg-glow-a:#dce7be;--ss-bg-glow-b:#b5cb92;--ss-panel:#c7d6ac;--ss-panel-low:#b6c99a;--ss-inset:#d9e4c4;--ss-focus:#345b40;--ss-theme-radius:6px;color-scheme:light}
html[data-ss-theme="arcade"]{--bg:#0a1029;--card:#15214b;--card2:#0e1639;--text:#f4f7ff;--muted:#bbc4e7;--line:#4e5da4;--cyan:#54dcff;--pink:#ff56ac;--good:#5dfaa4;--warn:#ffe06e;--bad:#ff6978;--ss-bg-glow-a:#222d75;--ss-bg-glow-b:#541750;--ss-panel:#182657;--ss-panel-low:#101839;--ss-inset:#0a1230;--ss-focus:#ffe06e;--ss-theme-radius:12px}
html[data-ss-theme="ghost"]{--bg:#110e1b;--card:#251b37;--card2:#1a1528;--text:#f4ecff;--muted:#bbaed1;--line:#584570;--cyan:#74e5d9;--pink:#d990ff;--good:#75efb3;--warn:#ffce7d;--bad:#ff718c;--ss-bg-glow-a:#30204b;--ss-bg-glow-b:#271a42;--ss-panel:#2b2040;--ss-panel-low:#1e172e;--ss-inset:#161122;--ss-focus:#bd90ff;--ss-theme-radius:20px}
html[data-ss-theme="shiny"] body{background:#101322}
html[data-ss-theme="retro"] body{background:var(--bg);font-family:Consolas,'Courier New',monospace;color:var(--text)}

html[data-ss-theme="ghost"] body{background:var(--bg);color:var(--text)}
html[data-ss-theme] .activityItem{background:var(--ss-inset)!important;color:var(--text)!important;border-top-color:var(--line)!important;border-right-color:var(--line)!important;border-bottom-color:var(--line)!important}
html[data-ss-theme] .activitySource{color:var(--text)!important}
html[data-ss-theme] .activityMessage{color:var(--text)!important}
html[data-ss-theme="retro"] .activityTime{color:#294532!important;text-shadow:none!important}
html[data-ss-theme="retro"] .activitySource{color:#233727!important}
html[data-ss-theme="retro"] .activityItem:hover{background:#d9e4c4!important;box-shadow:3px 3px 0 #58715855!important}
html[data-ss-theme="ghost"] .activityItem:hover{background:#2b2040!important;box-shadow:0 0 18px #ae79dd33!important}
html[data-ss-theme="arcade"] .activityItem:hover{background:#1b2a5a!important;box-shadow:0 0 16px #54dcff22!important}
html[data-ss-theme="arcade"] .activityItem .activitySource,
html[data-ss-theme="arcade"] .ss-activity-card .ss-activity-channel {
  color:#7ee8ff !important;
  text-shadow:0 0 9px rgba(84,220,255,.16) !important;
}
html[data-ss-theme="arcade"] .activityItem .activityTime,
html[data-ss-theme="arcade"] .ss-activity-card .ss-activity-time {
  color:#ff8bc8 !important;
}
/* Restore Activity's exact card geometry and inset accent after legacy demo overrides. */
.activityItem{
  background:#080b11;
  border:1px solid var(--line);
  border-left:4px solid var(--activityAccent,#55d8ff);
  border-radius:14px;
  padding:12px 14px;
  box-shadow:inset 10px 0 22px -20px var(--activityAccent,#55d8ff);
  transition:border-color .2s ease,box-shadow .2s ease;
}
.activityTop{display:flex;align-items:center;gap:10px}
.activitySource{font-weight:800;color:#f3f6fb}
.activityTime{margin-left:auto;font:11px Consolas,monospace;color:#687489}
.activityMessage{margin-top:7px;color:#d6deea;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
html[data-ss-theme] .activityItem{background:var(--ss-inset)!important;color:var(--text)!important;border-top-color:var(--line)!important;border-right-color:var(--line)!important;border-bottom-color:var(--line)!important}
html[data-ss-theme] .activityMessage{color:var(--text)!important}
html[data-ss-theme="retro"] .activitySource{color:#233727!important}
html[data-ss-theme="retro"] .activityTime{color:#294532!important}
html[data-ss-theme="arcade"] .activityItem .activitySource,
html[data-ss-theme="arcade"] .ss-activity-card .ss-activity-channel {
  color:#7ee8ff !important;
  text-shadow:0 0 9px rgba(84,220,255,.16) !important;
}
html[data-ss-theme="arcade"] .activityItem .activityTime,
html[data-ss-theme="arcade"] .ss-activity-card .ss-activity-time {
  color:#ff8bc8 !important;
}
/* Demo controls follow the source palette without touching action behavior. */
html[data-ss-theme] header{background:var(--ss-panel);color:var(--text)}
html[data-ss-theme] button,html[data-ss-theme] select{background:var(--ss-inset);color:var(--text);border-color:var(--line)}
html[data-ss-theme] .note{color:var(--muted)}
html[data-ss-theme="retro"] .activityItem{border-radius:6px}
html[data-ss-theme="retro"] button{border-radius:5px}
@media(prefers-reduced-motion:reduce){.activityItem{transition:none!important}}

</style>
<style>
/* SHINY-HTML-LIVE-BRIDGE-V1; additive styling only; retain Activity card CSS unmodified. */
html, body { height:100%; }
body.live-deck { min-width:0; padding:10px 12px 10px; overflow:hidden; display:flex; flex-direction:column; }
.live-header {display:flex;align-items:center;gap:8px;margin:0 0 9px;padding:5px 7px 5px 10px;min-height:40px;flex:none;user-select:none;cursor:move;}
.live-header strong {white-space:nowrap; font-size:13px;}
.grip {opacity:.68;font-size:17px;letter-spacing:-3px;cursor:move;}
.live-count {display:inline-flex;justify-content:center;min-width:20px;min-height:20px;padding:2px 5px;border-radius:99px;background:rgba(125,125,145,.16);font:11px Consolas,monospace;}
.header-actions {display:flex;gap:4px;margin-left:auto;align-items:center;cursor:default;}
.header-actions button {font-size:15px;min-width:29px;height:29px;padding:2px 5px;line-height:1;background:transparent;border-color:transparent;}
.header-actions button:hover{background:rgba(130,130,170,.15);}
#deck-content {display:flex;flex-direction:column;min-height:0;flex:1;}
.live-toolbar {display:flex;align-items:center;gap:7px;margin:0 0 9px;flex-wrap:wrap;}
.live-toolbar label {font-size:11px;opacity:.8;}
.live-toolbar select{font-size:12px;height:28px;padding:3px 5px;max-width:150px;}
.live-toolbar .small-button{font-size:11px;padding:5px 7px;white-space:nowrap;}
.live-toolbar #follow {max-width:125px;overflow:hidden;text-overflow:ellipsis;}
.stretch {flex:1;}
.live-feed {flex:1;min-height:0;max-height:none;overscroll-behavior:contain; padding:2px 2px 4px;}
.live-feed .activityItem {flex:none;min-height:68px;position:relative;}
.live-feed .activityTop {gap:7px;}
.live-feed .activitySource {font-size:14px;}
.live-feed .activityTime {white-space:nowrap; font-size:10px;}
.live-feed .dismiss {margin-left:2px;font-size:13px;width:23px;height:22px;padding:0;flex:none;background:transparent;}
.live-feed .activityMessage {opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.live-empty {padding:18px 10px;opacity:.64;text-align:center;font-size:12px;}
.live-footer {display:flex;gap:8px;align-items:center;justify-content:space-between;flex:none;margin-top:8px;font:10px/1.3 Segoe UI,Arial,sans-serif;opacity:.82;min-height:20px;}
.live-footer label {white-space:nowrap;display:flex;gap:3px;align-items:center;}
.live-footer input {margin:0 2px 0 0;accent-color:#55d8ff;}
.live-footer #status {white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dev-indicator {white-space:nowrap;font-weight:700;font-size:9px;letter-spacing:.08em;color:var(--ss-muted,var(--muted,#8b9ab9));}
.live-volume {display:flex;flex-direction:column;gap:5px;padding:9px 10px;margin:0 0 9px;background:var(--ss-inset,#080b11);border:1px solid var(--line);border-radius:10px;font-size:11px;}
.live-volume[hidden], .error-banner[hidden] {display:none!important;}
.volume-line {display:flex;align-items:center;gap:9px;justify-content:space-between;}
.volume-line input {flex:1;min-width:0;accent-color:#55d8ff;}
.volume-line button {font-size:10px;padding:4px 6px;}
.live-volume small {opacity:.72;font-size:10px;}
.error-banner {font-size:11px;padding:6px;margin:5px 0 0;border:1px solid #f66;border-radius:7px;background:#401923;color:#ffd2d8;}
body.tucked {padding:4px 7px;}
body.tucked .live-header {margin:0;background:transparent;min-height:39px;}
body.tucked #deck-content {display:none;}
body.tucked .live-header #growth,body.tucked .live-header #direction{display:none;}
body[data-theme=retro] .live-feed .activityItem {box-shadow:inset 10px 0 22px -20px var(--activityAccent,#345b40);}
@media(max-width:475px){.live-header strong {font-size:12px}.live-toolbar{gap:4px}.live-toolbar #follow{max-width:90px}.live-toolbar .small-button{font-size:10px}}

</style>

<style id="shiny-html-window-parity-v2">
/* SHINY-HTML-WINDOW-PARITY-V2: window shell only; approved Activity theme/card rules remain unchanged. */
html { height:100%; overflow:hidden; }
body.live-deck { height:100%; border:1px solid var(--line,#46567b); border-radius:11px; padding:7px 9px; }
body.live-deck .live-header { margin-bottom:7px; }
body.live-deck .live-feed .activityItem { cursor:pointer; min-height:62px; }
body.live-deck .live-feed .activityItem:focus-visible { outline:2px solid var(--activityAccent,#55d8ff); outline-offset:2px; }
body.live-deck .live-feed .dismiss { cursor:pointer; }
body.live-deck .live-footer { margin-top:5px; }
body.live-deck.tucked { padding:3px 6px; }
body.live-deck.tucked .live-header { min-height:34px; }
@media (max-width:460px) {
  body.live-deck {padding:6px;}
  .live-header {gap:5px;}
  .header-actions {gap:2px;}
  .header-actions button {min-width:27px; height:28px;}
  .live-toolbar {gap:4px;}
  .live-toolbar #follow {max-width:85px;}
}

</style>

<style id="shiny-html-controls-glow-v3">
/* SHINY-HTML-CONTROLS-GLOW-V3: additive chrome CSS only. Approved Activity cards untouched. */
/* The native deck places its header below the alerts in upwards mode. */
body.live-deck[data-direction="up"] { flex-direction:column-reverse; }
body.live-deck[data-direction="up"] .live-header { margin-top:6px; margin-bottom:0; }
body.live-deck[data-direction="up"] #deck-content { flex-direction:column-reverse; }
body.live-deck[data-direction="up"] .live-feed { display:flex; flex-direction:column-reverse; }
body.live-deck[data-direction="up"] .live-toolbar { margin-bottom:0; margin-top:6px; }
body.live-deck[data-direction="up"] .live-footer { margin-top:0; margin-bottom:5px; }
body.live-deck.tucked[data-direction="up"] .live-header { margin-top:0; }
/* Same <=20% or muted rule and #FF6377 warning tone as native. */
.header-actions #sound svg { width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle; }
body.live-deck.volume-muted #sound .volume-waves { display:none; }
body.live-deck:not(.volume-muted) #sound .volume-off { display:none; }
body.live-deck.volume-warning .header-actions #sound {
 color:#ff6377 !important; border:1px solid rgba(255,99,119,.5) !important;
 background:rgba(255,99,119,.09) !important; text-shadow:none;
}
body.live-deck.volume-warning .live-volume #volume-value,
body.live-deck.volume-warning .live-volume #mute {color:#ff6377 !important;}
body.live-deck.volume-warning .live-volume #volume-slider {accent-color:#ff6377;}
/* The production label uses Segoe UI bold with text-style U+2728 at the end.
   The original, restrained rainbow halo breathes through all ten native colors. */
.live-header .shiny-brand {
 display:inline-flex; align-items:baseline; gap:3px;
 font-family:'Segoe UI',Arial,sans-serif; font-size:12px; font-weight:700;
 color:#f3f7fb; white-space:nowrap;
 animation:ss-v3-rgb-cycle 28s linear infinite, ss-v3-breathe 3.9s ease-in-out infinite;
}
.live-header .shiny-stars {
 font-family:'Segoe UI Symbol','Segoe UI',sans-serif;
 font-variant-emoji:text; font-size:13px; font-weight:400;
}
@keyframes ss-v3-rgb-cycle {
 0%,100% {color:#e2f9ff;text-shadow:0 0 5px #55d8ff55,0 0 12px #55d8ff24;}
 10% {color:#ffdeef;text-shadow:0 0 5px #ff5cc855,0 0 12px #ff5cc824;}
 20% {color:#e0faeb;text-shadow:0 0 5px #63e6a355,0 0 12px #63e6a324;}
 30% {color:#fff4d9;text-shadow:0 0 5px #ffc85755,0 0 12px #ffc85724;}
 40% {color:#f1e9ff;text-shadow:0 0 5px #a78bfa55,0 0 12px #a78bfa24;}
 50% {color:#e2efff;text-shadow:0 0 5px #5ea1ff55,0 0 12px #5ea1ff24;}
 60% {color:#ffe2df;text-shadow:0 0 5px #ff7b7255,0 0 12px #ff7b7224;}
 70% {color:#f0ffde;text-shadow:0 0 5px #b5e85355,0 0 12px #b5e85324;}
 80% {color:#ffe4ee;text-shadow:0 0 5px #ff8fab55,0 0 12px #ff8fab24;}
 90% {color:#dcfaf6;text-shadow:0 0 5px #44d7c455,0 0 12px #44d7c424;}
}
@keyframes ss-v3-breathe {0%,100%{filter:brightness(.94)}50%{filter:brightness(1.12)}}
@media(prefers-reduced-motion:reduce){.live-header .shiny-brand{animation:none;color:#f3f7fb;text-shadow:0 0 5px #55d8ff55;}}

</style>

<style id="shiny-html-parity-v4">
/* SHINY-HTML-PARITY-V4 — supplemental layout for compact-mode volume.
   No changes to Activity cards, theme palettes, or breathing RGB chrome. */
body.live-deck.tucked.volume-open #deck-content { display:flex; flex:1; min-height:0; padding-top:4px; }
body.live-deck.tucked.volume-open #deck-content .live-toolbar,
body.live-deck.tucked.volume-open #deck-content .live-feed,
body.live-deck.tucked.volume-open #deck-content .live-footer,

</style>

<style id="SHINY-HTML-HEARTBEAT-ICONS-V6">
/* SHINY-HTML-HEARTBEAT-ICONS-V6: icon-only chrome polish. Activity card rules untouched. */

<style id="SHINY-HTML-DISMISS-FOOTER-V3">

  padding:3px 8px;
  font-size:10px;
  line-height:1.3;
  white-space:nowrap;
  cursor:pointer;
}
body.live-deck .live-footer > .dev-indicator { grid-column:3; justify-self:end; }
</style>
</head>
<body data-theme="shiny" class="live-deck">
  <header class="live-header" id="drag-zone" title="Drag to reposition. Double-click to tuck/expand.">
    <span class="grip" aria-hidden="true">⠿</span>
    <strong class="shiny-brand">ShinySlack <span class="shiny-stars" aria-label="sparkles">&#x2728;&#xFE0E;</span></strong>
    <span class="live-count" id="count">0</span>
    <div class="header-actions" id="header-actions">
      <button id="dashboard" title="Open ShinySlack dashboard" aria-label="Open dashboard">⌂</button>
      <button id="direction" title="Switch expansion direction" aria-label="Switch expansion direction">↓</button>
      <button id="growth" title="Cycle Auto → One card → Locked" aria-label="Cycle growth mode">A</button>
      <button id="sound" title="Router notification volume" aria-label="Open volume controls"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="volume-waves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/><path class="volume-off" d="m16 9 5 6m0-6-5 6"/></svg></button>
      <button id="tuck" title="Tuck/expand alert deck" aria-label="Tuck or expand">−</button>
      <button id="hide" title="Hide to notification area; keep alerts" aria-label="Hide deck">×</button>
    </div>
  </header>
  <section id="deck-content">
    <div class="live-toolbar">
      <label for="theme">Theme</label>
      <select id="theme" aria-label="Preview theme"><option value="shiny">✨ Shiny</option><option value="retro">🕹️ Retro</option><option value="arcade">👾 Arcade</option><option value="ghost">👻 Ghost Type</option></select>
      <button id="follow" class="small-button" title="Return to dashboard theme synchronization">Synced</button>
      <span class="stretch"></span>
      <span class="ss-toolbar-actions"><button id="sample" class="small-button" title="Generate a local sample card (no audio)">Test</button>
      </span>
    </div>
    <div class="live-volume" id="volume-panel" hidden>
      <div class="volume-line"><strong>Router volume</strong><span id="volume-value">100%</span></div>
      <div class="volume-line"><input id="volume-slider" type="range" min="0" max="100" step="1" value="100" aria-label="Router notification volume"><button id="mute" aria-label="Mute or unmute router">Mute</button></div>
      <small>Controls ShinySlack notification audio.</small>
    </div>
    <main id="feed" class="activityFeed live-feed" aria-live="polite"></main>
    <div class="live-footer">
      <label class="auto-dismiss"><input id="auto-dismiss" type="checkbox" checked> Auto-dismiss <span id="seconds">15s</span></label>
      <span id="status">Connecting…</span>
      <button id="dismissAll" class="small-button" title="Dismiss all cards in this HTML deck (native unaffected)">Dismiss all</button>
      <span class="dev-indicator">LIVE</span>
    </div>
    <p id="error-banner" class="error-banner" role="alert" hidden></p>
  </section>
  <script src="deck-live.js"></script>
</body>

</html>
