name: Build Windows installer and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (example: 0.1.0-beta)'
        required: false
        default: '0.1.0-beta'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $v = '${{ inputs.version }}'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Validate bundled PowerShell
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem .\app -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors){
              $failed=$true
              $errors | ForEach-Object { Write-Error ("{0}:{1}: {2}" -f $_.Extent.File,$_.Extent.StartLineNumber,$_.Message) }
            }
          }
          if($failed){ exit 1 }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" .\installer\ShinySlack.iss
          if(!(Test-Path .\dist\ShinySlackSetup.exe)){ throw 'Installer was not produced.' }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash=(Get-FileHash .\dist\ShinySlackSetup.exe -Algorithm SHA256).Hash
          "$hash  ShinySlackSetup.exe" | Set-Content .\dist\ShinySlackSetup.exe.sha256 -Encoding ASCII
          Get-Content .\dist\ShinySlackSetup.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinySlackSetup-${{ steps.version.outputs.version }}
          path: |
            dist/ShinySlackSetup.exe
            dist/ShinySlackSetup.exe.sha256

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            .\dist\ShinySlackSetup.exe `
            .\dist\ShinySlackSetup.exe.sha256 `
            --title "ShinySlack ${{ github.ref_name }}" `
            --generate-notes
